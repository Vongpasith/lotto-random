<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · ທຸກເວັບ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="admin.css?v=202611181500">
  <script>try { const t = localStorage.getItem("admin.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <!-- ເຂົ້າສູ່ລະບົບ -->
  <div id="loginView" class="login-wrap" hidden>
    <form id="loginForm" class="card login">
      <div class="brand-mark">📊</div>
      <h1>Admin</h1>
      <p class="muted">ສະຖິຕິ, feedback ແລະ ສະພາບເຊີບເວີ ຂອງທຸກເວັບ</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="ລະຫັດຜ່ານ" required>
      <button class="btn primary" type="submit">ເຂົ້າສູ່ລະບົບ</button>
      <p id="loginMsg" class="msg" role="status"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark">📊</span>
        <div><strong>Vongpasith</strong><small>Admin ທຸກເວັບ</small></div>
      </div>
      <nav id="nav" class="nav" aria-label="ເມນູ"></nav>
      <div class="side-foot">
        <button id="themeBtn" class="nav-item" type="button"><span class="ico">🌓</span><span>ສະຫຼັບສີ</span></button>
        <button id="logoutBtn" class="nav-item" type="button"><span class="ico">↩</span><span>ອອກຈາກລະບົບ</span></button>
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="ເປີດເມນູ">☰</button>
        <div class="title">
          <h1 id="pageTitle"></h1>
          <p id="pageSub" class="muted"></p>
        </div>
        <div class="top-actions">
          <div id="periods" class="chips" role="group" aria-label="ຊ່ວງເວລາ"></div>
          <span id="updated" class="muted small"></span>
          <button id="refreshBtn" class="icon-btn" type="button" title="ໂຫຼດໃໝ່" aria-label="ໂຫຼດໃໝ່">↻</button>
        </div>
      </header>

      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="tip" class="tip" hidden></div>

  <p id="offline" class="card offline" hidden>
    ໜ້າ admin ໃຊ້ໄດ້ສະເພາະທີ່ <a href="https://vongpasith.site/admin/">vongpasith.site/admin</a>
  </p>

  <script src="admin.js?v=202611181500"></script>
</body>
</html>
